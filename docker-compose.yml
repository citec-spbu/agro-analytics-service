services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: agro-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: analytics_dev
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ch-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'",
        ]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 20s

  # После изменений в src/ обязательно: docker compose build analytics-service && docker compose up -d analytics-service
  # (иначе в контейнере остаётся старый код — новые эндпоинты дадут 404)
  analytics-service:
    build: .
    container_name: analytics-service
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8010:8080"

volumes:
  ch-data:

networks:
  default:
    name: agronetwork
    external: true
